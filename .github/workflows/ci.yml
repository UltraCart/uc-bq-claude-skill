# Build and dependency-audit gate for pull requests.
#
# Without this, nothing verified that a PR still compiles — including the
# Dependabot PRs that change dependencies. This is the check that makes those
# PRs safe to merge.
#
# Security notes:
# - Read-only token; no secrets are exposed to PR code
# - Runs on pull_request (not pull_request_target), so forked PRs execute
#   without access to repository secrets
# - Pins all actions to exact commit SHAs (not mutable tags)

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only needs to read the code
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 1

      # node-version comes from the "volta" pin in package.json, so CI and
      # local development cannot drift apart.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      # ci is stricter than install — it installs the lockfile exactly and
      # fails if package.json and package-lock.json disagree.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Smoke test: the build can succeed while the entrypoint fails to load
      # (bad require, ESM/CJS mismatch in a bumped dependency). This catches
      # runtime breakage that tsc cannot see, which matters because the LLM
      # providers are require()d with `any` types.
      - name: Verify CLI entrypoint loads
        run: node dist/cli.js --version

  test:
    name: Test (${{ matrix.tz }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The suite runs under several timezones on purpose. The date bugs
        # this suite was written to catch were invisible in UTC and only
        # appeared either east of UTC or during US evening hours, so a
        # single-timezone run would have gone green on broken code.
        tz:
          - UTC
          - America/New_York   # UTC-4/-5, the primary merchant timezone
          - Asia/Tokyo         # UTC+9, no DST
          - Pacific/Auckland   # UTC+12/+13, the largest positive offset

    env:
      TZ: ${{ matrix.tz }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7.0.0
        with:
          node-version-file: package.json

      # Fails the build on a high or critical advisory in the production
      # dependency tree. Dev-only advisories are reported by the next step
      # but do not block, since they never reach a published artifact.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (informational)
        run: npm audit || true
